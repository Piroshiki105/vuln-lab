# devcontainer 用の差分。spanner / smtp4dev は、ルートの compose.yml で定義している。
# devcontainer.json が ["../compose.yml", "docker-compose.yml"] の順に読み込む。
services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.26-bookworm
    volumes:
      - ..:/workspaces/vuln-lab:cached
    command: sleep infinity
    environment:
      # 設定するとメール画面が smtp4dev へ実際に送信する。未設定ならプレビュー表示のみ。
      SMTP_ADDR: smtp4dev:25
      # アプリが接続する Cloud Spanner エミュレーター。実際の Google Cloud には接続しない。
      SPANNER_EMULATOR_HOST: spanner:9010
    depends_on:
      - smtp4dev
      - spanner
