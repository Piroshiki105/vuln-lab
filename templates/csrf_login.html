{{template "header" .}}
<h1>CSRF: ログイン</h1>
<p>CSRF を体験するため、まずログインします。SQLインジェクションの画面と同じアカウントを使えます(例: <code>alice</code> / <code>password1</code>)。</p>

<form method="post" action="/csrf/login">
  <p><label>ユーザー名 <input name="username" size="30"></label></p>
  <p><label>パスワード <input name="password" type="password" size="30"></label></p>
  <p><button type="submit">ログイン</button></p>
</form>

{{if .Failed}}
<p style="color:#b00020"><strong>ログイン失敗:</strong> ユーザー名またはパスワードが違います。</p>
{{end}}
{{template "footer" .}}
