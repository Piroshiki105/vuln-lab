{{template "header" .}}
<h1>{{.Title}}</h1>
<p>{{.Intro}}</p>

<form method="post" action="{{.Action}}">
  <p><label>ユーザー名 <input id="username" name="username" size="30"></label></p>
  <p><label>パスワード <input id="password" name="password" type="password" size="30"></label></p>
  <p><button type="submit">ログイン</button></p>
</form>

<h2>入力例を入れる</h2>
<p><small>ボタンを押すと上の欄に入力例が入ります。ログインボタンを押すと送信されます。</small></p>
<button type="button" class="btn" onclick="document.getElementById('username').value = 'alice'; document.getElementById('password').value = 'password1'">alice を入力</button>
<button type="button" class="btn" onclick="document.getElementById('username').value = 'bob'; document.getElementById('password').value = 'qwerty'">bob を入力</button>

{{if .Failed}}
<p style="color:#b00020"><strong>ログイン失敗:</strong> ユーザー名またはパスワードが違います。</p>
{{end}}
{{template "footer" .}}
